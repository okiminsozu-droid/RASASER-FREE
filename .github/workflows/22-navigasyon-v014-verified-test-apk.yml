name: Navigasyon v0.14 Gercek Rota Testinden Sonra APK
on:
  push:
    branches: [feature/rasaser-nav-valhalla-route-repair-v014]
    paths: ['.github/workflows/22-navigasyon-v014-verified-test-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-only-if-routes-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Signed APK and both real Android routing tests must pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          REPO="okiminsozu-droid/RASASER-FREE"
          # Android 15 plain Valhalla JNI, minified R8 APK, artifact build, search regression
          for RUN in 43894508946 43894508966 43894508872 43894508859; do
            STATE=""
            for attempt in $(seq 1 120); do
              STATE="$(gh run view "$RUN" --repo "$REPO" --json conclusion --jq .conclusion)"
              if [ "$STATE" = success ]; then break; fi
              if [ -n "$STATE" ]; then
                echo "Refusing unverified test APK: $RUN = $STATE" >&2
                exit 1
              fi
              sleep 10
            done
            test "$STATE" = success
          done
          NAME="$(gh api "repos/$REPO/actions/runs/43894508872/artifacts" \
            --jq '.artifacts[].name' | grep '^rasaser-navigasyon-v014-routefix-test-' | head -n 1)"
          test -n "$NAME"
          DIR="$RUNNER_TEMP/nav014"
          mkdir -p "$DIR"
          gh run download 43894508872 --repo "$REPO" --name "$NAME" --dir "$DIR"
          (cd "$DIR" && sha256sum -c SHA256SUMS.txt)
          APK="$DIR/RaSaSeR-Navigasyon-v0.14-routefix-TEST.apk"
          test -s "$APK"
          test "$(stat -c %s "$APK")" -lt 125000000
          echo "VERIFIED_APK=$APK" >> "$GITHUB_ENV"
      - name: Publish explicitly labeled prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          REPO="okiminsozu-droid/RASASER-FREE"
          TAG="rasaser-navigasyon-v0.14-routefix-test"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" \
              --target "feature/rasaser-nav-valhalla-route-repair-v014" \
              --title "RaSaSeR Navigasyon v0.14 — Valhalla rota onarım testi" \
              --notes "ANDROID SAHA TESTI. Yalnız Kotlin, imzalı APK, 1.15 GB gerçek Türkiye grafiğiyle Android 15 normal ve R8 küçültülmüş rota testleri, Android yer arama kontrolü başarılıysa yayınlanır. R2 haritaları değiştirilmedi. Bağımsız fieldtest14 uygulamasıdır, v0.13 uygulamasının özel verisini devralmaz. Veriler uygulamadan indirilecektir. Üretim ve gerçek yol güvenlik onayı değildir." \
              --prerelease
          fi
          gh release upload "$TAG" "$VERIFIED_APK#RaSaSeR-Navigasyon-v0.14-routefix-TEST.apk" \
            --repo "$REPO" --clobber
          gh release view "$TAG" --repo "$REPO" --json url,assets \
            --jq '{release:.url,apk:[.assets[] | {name:.name,size:.size,url:.url}]}'
