name: VARYOK Test APK
# Rebuild after correcting Android BroadcastReceiver import.
on:
  push:
    branches:
      - feature/rasaser-widgets-offline-v1
    paths:
      - .github/workflows/04-varyok-test-apk.yml
permissions:
  contents: write
concurrency:
  group: varyok-test-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  varyok:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Source checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python image tools
        run: |
          python3 -m pip install --break-system-packages Pillow
      - name: Prepare exact user-approved logo and crop app icon
        env:
          SOURCE_LOGO_URL: "https://d2ol7oe51mr4n9.cloudfront.net/user_3JQ0XW2ppGDdRUhLLqBC4ovOy01/b938ebaa-0def-4d54-9cf1-2a3913f6859e.png"
        run: |
          set -euo pipefail
          SRC="apps/rasaserwidgets/app/src/main/res/drawable-nodpi"
          mkdir -p "$SRC"
          if [ ! -s "$SRC/varyok_brand_full.png" ]; then
            curl -fLsS --retry 3 --retry-delay 2 "$SOURCE_LOGO_URL" -o /tmp/varyok_uploaded_logo
            python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open('/tmp/varyok_uploaded_logo').convert('RGB')
          if src.width < 1000 or src.height < 1000:
              raise SystemExit('Logo resolution too small; refusing incorrect asset')
          out = 'apps/rasaserwidgets/app/src/main/res/drawable-nodpi'
          src.save(os.path.join(out, 'varyok_brand_full.png'), optimize=True)
          PY
          fi
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root = Path('apps/rasaserwidgets/app/src/main/res/drawable-nodpi')
          src = Image.open(root/'varyok_brand_full.png').convert('RGB')
          w,h=src.size
          emblem=src.crop((round(w*345/1536),round(h*120/1536),round(w*1191/1536),round(h*890/1536)))
          emblem.thumbnail((910,910),Image.Resampling.LANCZOS)
          canvas=Image.new('RGB',(1024,1024),(0,0,0))
          canvas.paste(emblem,((1024-emblem.width)//2,(1024-emblem.height)//2))
          canvas.resize((512,512),Image.Resampling.LANCZOS).save(root/'varyok_app_icon.png',optimize=True)
          print('VARYOK exact source logo + app icon prepared', src.size)
          PY
      - name: Commit original logo resources only to VARYOK source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rasaserwidgets/app/src/main/res/drawable-nodpi/varyok_brand_full.png apps/rasaserwidgets/app/src/main/res/drawable-nodpi/varyok_app_icon.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(varyok): add approved full black-gold logo and V emblem icon"
            git push origin HEAD:feature/rasaser-widgets-offline-v1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK without obsolete tools package
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Source and privacy tests
        run: |
          python3 tools/check_repo.py
          python3 tools/validate_app.py rasaserwidgets true
          python3 apps/rasaserwidgets/qa/test_source_contract.py
      - name: Compile VARYOK debug APK and run unit tests
        run: gradle --no-daemon --project-dir apps/rasaserwidgets :app:assembleDebug :app:testDebugUnitTest
      - name: Verify debug APK
        run: |
          ls -lh apps/rasaserwidgets/app/build/outputs/apk/debug/*.apk
          sha256sum apps/rasaserwidgets/app/build/outputs/apk/debug/*.apk
      - name: Upload short-lived test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VARYOK-0.3.1-TEST-APK
          path: apps/rasaserwidgets/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
