name: VARYOK 0.3.5 Test APK
# Premium info UI, six languages; no active purchases or billing products.
on:
  push:
    branches:
      - feature/rasaser-widgets-offline-v1
    paths:
      - .github/workflows/04-varyok-test-apk.yml
permissions:
  contents: read
concurrency:
  group: varyok-test-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  varyok:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Source checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify user-approved logo and app icon are preserved
        run: |
          test -s apps/rasaserwidgets/app/src/main/res/drawable-nodpi/varyok_brand_full.png
          test -s apps/rasaserwidgets/app/src/main/res/drawable-nodpi/varyok_app_icon.png
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK setup
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Privacy and source checks
        run: |
          python3 tools/check_repo.py
          python3 tools/validate_app.py rasaserwidgets true
          python3 apps/rasaserwidgets/qa/test_source_contract.py
      - name: Compile debug APK and run tests
        run: gradle --no-daemon --project-dir apps/rasaserwidgets :app:assembleDebug :app:testDebugUnitTest
      - name: Verify compiled APK
        run: |
          ls -lh apps/rasaserwidgets/app/build/outputs/apk/debug/*.apk
          sha256sum apps/rasaserwidgets/app/build/outputs/apk/debug/*.apk
      - name: Upload VARYOK test APK
        uses: actions/upload-artifact@v4
        with:
          name: VARYOK-0.3.5-TEST-APK
          path: apps/rasaserwidgets/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
