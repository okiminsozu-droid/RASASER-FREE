name: İçerik Üreticisi — Medya ve Zamanlama Test APK
on:
  push:
    branches:
      - feature/icerik-ureticisi-android-v1
    paths:
      - 'apps/icerikureticisi/**'
      - '.github/workflows/04-icerik-ureticisi-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icerikureticisi-v020-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Security, unit tests, debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preinstalled Android SDK setup
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Security and package metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_repo.py
          python3 tools/validate_app.py icerikureticisi true

      - name: Build debug APK and unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --project-dir apps/icerikureticisi :app:assembleDebug :app:testDebugUnitTest
          APK="apps/icerikureticisi/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/icerik-manifest.txt
          if grep -E -q 'BIND_NOTIFICATION_LISTENER_SERVICE|SocialNotificationListener|NotificationListenerService' /tmp/icerik-manifest.txt; then
            echo "ERROR: Sensitive notification listener still in APK"
            exit 1
          fi
          "$AAPT" dump badging "$APK" | head -n 4
          if ! "$AAPT" dump badging "$APK" | grep -q "name='com.rasaser.free.icerikureticisi.preview' versionCode='3' versionName='0.2.0'"; then
            echo "ERROR: Debug preview identity mismatch"
            exit 1
          fi
          sha256sum "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RaSaSeR-Icerik-Ureticisi-v020-preview-debug-${{ github.run_number }}
          path: apps/icerikureticisi/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
