name: İçerik Üreticisi — v0.4.2 Dört Platform Çoklu OAuth Temeli
on:
  push:
    branches:
      - feature/icerik-ureticisi-android-v1
      - feature/icerik-ureticisi-brand-secure-multilang-v030
      - feature/icerik-ureticisi-biometric-trial-cloudflare-v031
      - feature/icerik-ureticisi-share-premium-v032
      - feature/icerik-ureticisi-premium-clean-v033
      - feature/icerik-ureticisi-premium-clean-v033-sideinstall
      - feature/icerik-ureticisi-official-accounts-avatar-v034
      - feature/icerik-ureticisi-independent-oauth-core-v035
      - feature/icerik-ureticisi-account-bridge-v036
      - feature/icerik-ureticisi-shortcut-browser-fix-v037
      - feature/icerik-ureticisi-independent-multichannel-v038
      - feature/icerik-ureticisi-direct-app-routing-v039
      - feature/icerik-ureticisi-ondevice-publish-v040
      - feature/icerik-ureticisi-embedded-social-hub-v041
      - feature/icerik-ureticisi-four-platform-connection-foundation-v042
    paths:
      - 'apps/icerikureticisi/**'
      - '.github/workflows/04-icerik-ureticisi-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icerikureticisi-v030-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Security, unit tests, debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preinstalled Android SDK setup
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Security and package metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_repo.py
          python3 tools/validate_app.py icerikureticisi true
          if grep -R -E -q 'RSR(-[A-HJ-NP-Z2-9]{6}){4}' apps/icerikureticisi/app/src/main; then
            echo "ERROR: owner promo code pattern detected in public APK sources"
            exit 1
          fi
          if ! grep -q 'android.permission.INTERNET' apps/icerikureticisi/app/src/main/AndroidManifest.xml; then
            echo "ERROR: direct social API calls need INTERNET permission"
            exit 1
          fi
          if grep -R -E -q 'workers[.]dev|https://www[.]okiminsozu[.]com|BEGIN.*PRIVATE KEY' apps/icerikureticisi/app/src/main; then
            echo "ERROR: external publisher backend or embedded signing private key found in local-only APK"
            exit 1
          fi
          if ! grep -q 'OfflinePremiumLicense.valid' apps/icerikureticisi/app/src/main/java/com/rasaser/free/icerikureticisi/OwnerPremium.kt; then
            echo "ERROR: offline voucher verification is absent"
            exit 1
          fi
          if ! test -s apps/icerikureticisi/app/src/main/java/com/rasaser/free/icerikureticisi/DeviceOAuthVault.kt || ! test -s apps/icerikureticisi/app/src/main/java/com/rasaser/free/icerikureticisi/OAuthPkceCore.kt; then
            echo "ERROR: encrypted OAuth vault or PKCE core missing"
            exit 1
          fi
          # Brand assets must be part of APK, never fetched from CDN at runtime.
          for provider in instagram facebook x youtube tiktok pinterest bluesky telegram; do
            icon="apps/icerikureticisi/app/src/main/res/drawable/brand_${provider}.xml"
            test -s "$icon"
            grep -q 'android:pathData=' "$icon"
          done
          if grep -R -E -q 'https://cdn[.]simpleicons[.]org|api.telegram.org.*Log[.]' apps/icerikureticisi/app/src/main; then
            echo "ERROR: remote brand icons or secret-bearing logs forbidden"
            exit 1
          fi

      - name: Build debug APK and unit tests
        shell: bash
        run: |
          set -euo pipefail
          # Maven Central may intermittently return HTTP 429. Retry only this
          # transient network failure; do not hide compiler or test errors.
          for attempt in 1 2 3; do
            if gradle --no-daemon --stacktrace --project-dir apps/icerikureticisi :app:assembleDebug :app:testDebugUnitTest > /tmp/creator-gradle-build.log 2>&1; then
              cat /tmp/creator-gradle-build.log
              break
            fi
            echo "---- Gradle error overview ----"
            grep -n -E '^e: |^error: |^FAILURE:|^\* What went wrong:|^Execution failed|^> Task.*FAILED|^Caused by:' /tmp/creator-gradle-build.log | head -n 65 || true
            echo "---- Unit test failures ----"
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('apps/icerikureticisi/app/build/test-results/testDebugUnitTest/*.xml'):
              try:
                  root = ET.parse(path).getroot()
                  for test in root.iter('testcase'):
                      fail = test.find('failure')
                      if fail is None: fail = test.find('error')
                      if fail is not None:
                          print(f"{test.attrib.get('classname')} / {test.attrib.get('name')}: {fail.attrib.get('message')}")
                          print((fail.text or '')[:1100])
              except Exception as e:
                  print('Cannot read test report:', type(e).__name__)
          PY
            tail -n 25 /tmp/creator-gradle-build.log
            if ! grep -E -q 'status code 429|Too Many Requests|HTTP 429' /tmp/creator-gradle-build.log || [ "$attempt" -ge 3 ]; then
              echo "ERROR: Gradle failed (non-429 error or retry limit reached)"
              exit 1
            fi
            echo "Maven rate limit (429); retry $attempt/3"
            sleep $((attempt * 20))
          done
          APK="apps/icerikureticisi/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/icerik-manifest.txt
          if grep -E -q 'BIND_NOTIFICATION_LISTENER_SERVICE|SocialNotificationListener|NotificationListenerService' /tmp/icerik-manifest.txt; then
            echo "ERROR: Sensitive notification listener still in APK"
            exit 1
          fi
          "$AAPT" dump badging "$APK" | head -n 4
          if ! "$AAPT" dump badging "$APK" | grep -q "name='com.rasaser.free.icerikureticisi.v042' versionCode='16' versionName='0.4.2'"; then
            echo "ERROR: Debug preview identity mismatch"
            exit 1
          fi
          sha256sum "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RaSaSeR-Icerik-Ureticisi-v042-Dort-Platform-OAuth-${{ github.run_number }}
          path: apps/icerikureticisi/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
