name: Navigasyon Android Derleme Testi
on:
  pull_request:
    paths:
      - 'apps/navigasyon/**'
      - '.github/workflows/05-navigasyon-android-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android API 36
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: App kimligi ve gizlilik kontrolu
        run: |
          python3 tools/check_repo.py
          python3 tools/validate_app.py navigasyon false
      - name: Cevrimdisi yer adlari icin lisansli glyph kaynaklarini paketle
        run: python3 apps/navigasyon/tools/prepare_offline_glyphs.py --target "apps/navigasyon/app/src/main/assets/fonts/Noto Sans Regular"
      - name: Noto Sans Arabic (SIL OFL) offline font
        run: |
          set -Eeuo pipefail
          FONT="apps/navigasyon/app/src/main/assets/fonts/NotoSansArabic-Regular.ttf"
          mkdir -p "$(dirname "$FONT")"
          curl --proto '=https' --tlsv1.2 -fL --retry 4 --connect-timeout 25 \
            --output "$FONT" \
            "https://raw.githubusercontent.com/notofonts/noto-fonts/ffebf8c1ee449e544955a7e813c54f9b73848eac/hinted/ttf/NotoSansArabic/NotoSansArabic-Regular.ttf"
          test "$(stat -c %s "$FONT")" -eq 240456
      - name: Cihaz testi için Türkiye çevrimdışı yer indeksini APK içine ekle
        run: |
          set -Eeuo pipefail
          ZIP="$RUNNER_TEMP/rasaser-turkey-places.zip"
          curl --proto '=https' --tlsv1.2 -fL --retry 5 --retry-delay 7 \
            -o "$ZIP" \
            "https://github.com/okiminsozu-droid/RASASER-FREE/releases/download/rasaser-turkiye-search-v0.1/turkey-places.zip"
          echo "048f474b1ff427ac2310b5201a283d027d87ec769ca7e808254ffbbdf6b603f0  $ZIP" | sha256sum -c -
          TARGET="apps/navigasyon/app/src/fieldTest/assets/search/turkey-places.sqlite"
          mkdir -p "$(dirname "$TARGET")"
          unzip -p "$ZIP" turkey-places.sqlite > "$TARGET"
          test "$(stat -c %s "$TARGET")" -eq 150110208
          echo "8ce8f9592e223a4d310c4e4b12151334e50dc13fa5054f44ec3ff525adce038f  $TARGET" | sha256sum -c -
          echo "Verified ODbL Türkiye name index embedded in FIELD TEST only"
      - name: Kotlin unit tests ve Android APK derleme
        run: gradle --no-daemon --project-dir apps/navigasyon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleFieldTest
      - name: Installable optimized field test APK verify
        run: |
          set -Eeuo pipefail
          APK="apps/navigasyon/app/build/outputs/apk/fieldTest/app-fieldTest.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK" | tail -2
          # Confirm the packaged APK actually contains the full verified search
          # database. Source files existing on CI disk is not sufficient.
          test "$(unzip -Z -1 "$APK" | grep -c '^assets/search/turkey-places.sqlite
          cp "$APK" "apps/navigasyon/field-test/RaSaSeR-Navigasyon-v0.8-TEST.apk"
          (
            cd "apps/navigasyon/field-test"
            sha256sum "RaSaSeR-Navigasyon-v0.8-TEST.apk" > SHA256SUMS.txt
          )
          echo "DEVELOPMENT TEST ONLY. No map/data pack embedded. Not for public road use." > "apps/navigasyon/field-test/README.txt"
          echo "The test signing key is generated by the GitHub runner and will change on rebuild. Reinstall instead of updating. Release build uses a different key and a different package ID." >> "apps/navigasyon/field-test/README.txt"
          du -h "apps/navigasyon/field-test/RaSaSeR-Navigasyon-v0.8-TEST.apk"
      - name: Downloadable short-lived device test APK
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/rasaser-nav-turkiye-data-v1' }}
        uses: actions/upload-artifact@v4
        with:
          name: rasaser-navigasyon-v08-test-${{ github.run_number }}
          path: |
            apps/navigasyon/field-test/RaSaSeR-Navigasyon-v0.8-TEST.apk
            apps/navigasyon/field-test/SHA256SUMS.txt
            apps/navigasyon/field-test/README.txt
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
      # Only transient sideload test artifacts are uploaded, no production signing keys.
)" -eq 1
          unzip -p "$APK" assets/search/turkey-places.sqlite | sha256sum -c <(echo "8ce8f9592e223a4d310c4e4b12151334e50dc13fa5054f44ec3ff525adce038f  -")
          mkdir -p "apps/navigasyon/field-test"
          cp "$APK" "apps/navigasyon/field-test/RaSaSeR-Navigasyon-v0.8-TEST.apk"
          (
            cd "apps/navigasyon/field-test"
            sha256sum "RaSaSeR-Navigasyon-v0.8-TEST.apk" > SHA256SUMS.txt
          )
          echo "DEVELOPMENT TEST ONLY. No map/data pack embedded. Not for public road use." > "apps/navigasyon/field-test/README.txt"
          echo "The test signing key is generated by the GitHub runner and will change on rebuild. Reinstall instead of updating. Release build uses a different key and a different package ID." >> "apps/navigasyon/field-test/README.txt"
          du -h "apps/navigasyon/field-test/RaSaSeR-Navigasyon-v0.8-TEST.apk"
      - name: Downloadable short-lived device test APK
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/rasaser-nav-turkiye-data-v1' }}
        uses: actions/upload-artifact@v4
        with:
          name: rasaser-navigasyon-v08-test-${{ github.run_number }}
          path: |
            apps/navigasyon/field-test/RaSaSeR-Navigasyon-v0.8-TEST.apk
            apps/navigasyon/field-test/SHA256SUMS.txt
            apps/navigasyon/field-test/README.txt
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
      # Only transient sideload test artifacts are uploaded, no production signing keys.
