name: Navigasyon Android Derleme Testi
on:
  pull_request:
    paths:
      - 'apps/navigasyon/**'
      - '.github/workflows/05-navigasyon-android-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: App kimligi ve gizlilik kontrolu
        run: |
          python3 tools/check_repo.py
          python3 tools/validate_app.py navigasyon false
      - name: Cevrimdisi yer adlari icin lisansli glyph kaynaklarini paketle
        run: python3 apps/navigasyon/tools/prepare_offline_glyphs.py --target "apps/navigasyon/app/src/main/assets/fonts/Noto Sans Regular"
      - name: Kotlin unit tests ve Android APK derleme
        run: gradle --no-daemon --project-dir apps/navigasyon :app:testDebugUnitTest :app:assembleDebug
      # Public debug APK is intentionally not uploaded; release keys PRIVATE only.
