name: Kur'an Kelime Atölyesi - Bağımsız Önizleme CI
on:
  push:
    branches:
      - feature/kurankelime-five-language-offline-v1
    paths:
      - 'apps/kurankelime/**'
      - '.github/workflows/04-kuran-kelime.yml'
  pull_request:
    paths:
      - 'apps/kurankelime/**'
      - '.github/workflows/04-kuran-kelime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Repository and license guards
        run: |
          python3 tools/check_repo.py
          python3 tools/validate_app.py kurankelime false
      - name: Check Quran preview dataset
        run: python3 -m unittest discover -s apps/kurankelime/tests -v
      - name: Build Android debug and unit tests
        run: gradle --no-daemon --project-dir apps/kurankelime :app:assembleDebug :app:testDebugUnitTest
      - name: Verify test APK and avoid distributing licensed PDF
        run: |
          test -s apps/kurankelime/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          apk='apps/kurankelime/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(apk) as z:
              assert 'assets/quran/kelime_mealli.pdf' not in z.namelist(), 'PDF must not be released via the public repo'
              assert 'classes.dex' in z.namelist()
          print('Verified public test APK: PDF not bundled; device import supported')
          PY
      - name: Publish installable preview APK (7-day artifact)
        if: ${{ github.ref == 'refs/heads/feature/kurankelime-five-language-offline-v1' && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: Kurani_Kesfet_TEST_APK_PDF_yerel_secilecek
          path: apps/kurankelime/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
