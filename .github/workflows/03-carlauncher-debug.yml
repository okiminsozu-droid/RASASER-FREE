name: CAR LAUNCHER - Original ZIP Debug APK

on:
  push:
    branches: [main]
    paths:
      - "apps/carlauncher/source-packed/**"
      - "apps/carlauncher/unpack_original.py"
      - ".github/workflows/03-carlauncher-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carlauncher-original-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python for source integrity restore
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unpack original ZIP sources without editing Kotlin
        run: |
          python3 -m pip install --disable-pip-version-check brotli==1.1.0
          python3 apps/carlauncher/unpack_original.py
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Use preinstalled Android SDK on ubuntu-latest; setup-android@v3 requests removed 'tools' package.
      - name: Install Android 34 platform
        run: |
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-34" "build-tools;34.0.0"
      - name: Setup Gradle 8.7 (original wrapper version)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build original Debug APK
        run: gradle --no-daemon --project-dir apps/carlauncher/original :app:assembleDebug
      - name: Show APK checksum
        run: sha256sum apps/carlauncher/original/app/build/outputs/apk/debug/*.apk
      - name: Publish installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: RaSaSeR-CAR-LAUNCHER-ORIGINAL-TEST-APK
          path: apps/carlauncher/original/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
