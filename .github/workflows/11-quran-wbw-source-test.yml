name: Quran Turkish Word API Smoke Test
on:
  push:
    branches: [feature/kelime-mealli-kuran-pdf-v1]
    paths: [.github/workflows/11-quran-wbw-source-test.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request original Açık Kuran word data
        run: |
          python - <<'PY'
          import urllib.request,json
          urls=['https://api.acikkuran.com/surah/1/verse/1/verseparts','https://api.acikkuran.com/surah/2/verse/2/verseparts']
          for url in urls:
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'RaSaSeR-Free-PDF-Builder/1.0','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=15) as res:
             b=res.read();j=json.loads(b)
             rows=j.get('data',[])
             print(url,'STATUS',res.status,'ROWS',len(rows),'SAMPLE',[{'arabic':x.get('arabic'),'tr':x.get('translation_tr')} for x in rows[:3]])
           except Exception as e:print(url,'ERROR',str(e))
          PY
