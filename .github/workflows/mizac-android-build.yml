name: MIZAC Android Compile Check

on:
  push:
    paths:
      - "apps/mizac/**"
      - "engine-contracts/**"
      - ".github/workflows/mizac-android-build.yml"
  pull_request:
    paths:
      - "apps/mizac/**"
      - "engine-contracts/**"
      - ".github/workflows/mizac-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizac-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile MIZAC Debug (no signing)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build isolated MIZAC application
        working-directory: apps/mizac
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify installable test APK
        run: |
          test -s apps/mizac/app/build/outputs/apk/debug/app-debug.apk
          sha256sum apps/mizac/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload MIZAC universal test APK
        uses: actions/upload-artifact@v4
        with:
          name: MIZAC-5DIL-120SORU-TEST-APK
          path: apps/mizac/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
