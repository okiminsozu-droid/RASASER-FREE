name: MIZAC Android Compile Check

on:
  push:
    paths:
      - "apps/mizac/**"
      - "engine-contracts/**"
      - ".github/workflows/mizac-android-build.yml"
  pull_request:
    paths:
      - "apps/mizac/**"
      - "engine-contracts/**"
      - ".github/workflows/mizac-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizac-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile MIZAC Debug (no signing)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build isolated MIZAC application
        working-directory: apps/mizac
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify unsigned debug package
        run: test -s apps/mizac/app/build/outputs/apk/debug/app-debug.apk
