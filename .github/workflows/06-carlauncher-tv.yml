name: CAR LAUNCHER - V2.1 TV Playback Test APK

on:
  push:
    branches: [fix/carlauncher-tv-playback-v2-1-1]
    paths:
      - "apps/carlauncher/source-packed/**"
      - "apps/carlauncher/unpack_original.py"
      - "apps/carlauncher/v2/**"
      - ".github/workflows/06-carlauncher-tv.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carlauncher-tv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python for source integrity restore
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unpack original ZIP sources without editing Kotlin
        run: |
          python3 -m pip install --disable-pip-version-check brotli==1.1.0
          python3 apps/carlauncher/unpack_original.py
      - name: Apply preserved dashboard V2.1 fixes
        run: python3 apps/carlauncher/v2/apply_v2.py
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK (current action, no deprecated tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android 34 platform
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Setup Gradle 8.7 (original wrapper version)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build dashboard V2.1 Debug APK
        run: gradle --no-daemon --project-dir apps/carlauncher/original :app:assembleDebug
      - name: Show APK checksum
        run: sha256sum apps/carlauncher/original/app/build/outputs/apk/debug/*.apk
      - name: Publish installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: RaSaSeR-CAR-LAUNCHER-V2-1-TV-TEST-APK
          path: apps/carlauncher/original/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
