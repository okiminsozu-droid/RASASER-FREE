# Replace news.example.org and certificate paths with a domain and certificate you own.
# This is a sample configuration, NOT a provisioned/installed HTTPS endpoint.
server {
    listen 443 ssl;
    server_name news.example.org;
    ssl_certificate /etc/ssl/trendnabiz/fullchain.pem;
    ssl_certificate_key /etc/ssl/trendnabiz/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    location / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8808;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 150s;
    }
}
